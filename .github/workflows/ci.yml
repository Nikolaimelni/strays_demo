name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VITE_API_URL: http://localhost:3000
  MEDIA_ORIGIN: https://pub-example.r2.dev
  VITE_CONTACT_EMAIL: ci@example.test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # runtime deps only, and only the advisories worth stopping for. this is
      # meant to go red and be acted on, so no continue-on-error.
      - run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
